name: CI

on:
  pull_request:
    branches: [main]
  # Pushes to main run these jobs from deploy.yml, which deploys only if they all pass
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # The CSS minifier writes for build.target, which must keep the oldest browsers
      # README supports: their media queries and their 100vh fallbacks
      - name: Check the CSS against the oldest supported browsers
        run: node scripts/check-built-css.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          # Keep .nojekyll and .well-known/ so the artifact matches the deployed site
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # The browser of the @playwright/test version in package-lock.json, with its system libraries
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Every production, opened from its link and started with one click: its start keys,
      # its picture and its sound, in Chromium against the production build
      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npx tsc -b

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Report only: it covers the development tools, whose advisories rarely reach the site
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # Fails CI: the dependencies the site is built from, React and js-dos among them,
      # must have no high or critical advisories
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
