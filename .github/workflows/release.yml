name: Release Please

on:
  push:
    branches:
      - main

# Read-only by default; each job gets only the write access it needs
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release branch, tags and GitHub releases
      pull-requests: write # the release PR and its labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # release-type mode takes all settings from these inputs, not from config files
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build and upload artifacts when a release is created
  build-release:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # gh release upload attaches the archive to the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # npm ci runs dependencies' install scripts, so keep the token out of .git/config.
          # The upload step hands gh the token through GITHUB_TOKEN instead.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # The tag reaches the scripts through env, so it is never pasted into shell code
      - name: Create release archive
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd dist
          zip -r "../doskit-${TAG_NAME}.zip" .

      - name: Upload release artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" "doskit-${TAG_NAME}.zip"
