<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Preload the WASM module for the default "dosbox" backend -->
    <link rel="preload" href="/emulators/wdosbox.wasm" as="fetch" crossorigin />

    <!-- Primary Meta Tags -->
    <title>DosKit - DOS demoscene classics in your browser</title>
    <meta name="title" content="DosKit - DOS demoscene classics in your browser" />
    <meta
      name="description"
      content="DOS demoscene classics and the trackers behind them, playable in your browser. Second Reality, Unreal, Panic and Crystal Dream 2, and Impulse Tracker and Scream Tracker 3, run from their original files."
    />
    <meta
      name="keywords"
      content="demoscene, DOS demos, Second Reality, Future Crew, Impulse Tracker, Scream Tracker, tracker music, DOSBox, js-dos, WebAssembly"
    />
    <meta name="author" content="Cameron Rye" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DosKit" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Humans.txt -->
    <link rel="author" type="text/plain" href="/humans.txt" />

    <!-- Apple Touch Icons, opaque since iOS fills transparent pixels with black. iPhones
         take the size of their screen, and iPads scale the 180x180 one down. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120x120.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://doskit.net/" />
    <meta property="og:site_name" content="DosKit" />
    <meta property="og:title" content="DosKit - DOS demoscene classics in your browser" />
    <meta
      property="og:description"
      content="DOS demoscene classics and the trackers behind them, playable in your browser. Second Reality, Unreal, Panic and Crystal Dream 2, and Impulse Tracker and Scream Tracker 3, run from their original files."
    />
    <meta property="og:image" content="https://doskit.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DosKit: DOS demoscene classics and the trackers behind them, playable in your browser"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://doskit.net/" />
    <meta name="twitter:title" content="DosKit - DOS demoscene classics in your browser" />
    <meta
      name="twitter:description"
      content="DOS demoscene classics and the trackers behind them, playable in your browser. Second Reality, Unreal, Panic and Crystal Dream 2, and Impulse Tracker and Scream Tracker 3, run from their original files."
    />
    <meta name="twitter:image" content="https://doskit.net/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="DosKit: DOS demoscene classics and the trackers behind them, playable in your browser"
    />
    <meta name="twitter:creator" content="@cameronrye" />
    <meta name="twitter:site" content="@cameronrye" />

    <!-- js-dos CSS (local copy) -->
    <link rel="stylesheet" href="/js-dos.css" />

    <!-- js-dos JavaScript (local copy, loaded before React app) -->
    <script src="/js-dos.js" defer fetchpriority="high"></script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://doskit.net/#website",
            "url": "https://doskit.net/",
            "name": "DosKit",
            "description": "DOS demoscene classics and the trackers behind them, playable in your browser.",
            "inLanguage": "en-US",
            "publisher": {
              "@type": "Person",
              "@id": "https://doskit.net/#person"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://doskit.net/#softwareapplication",
            "name": "DosKit",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "Web Browser",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "description": "DOS demoscene classics and the trackers behind them, playable in your browser. Second Reality, Unreal, Panic and Crystal Dream 2, and Impulse Tracker and Scream Tracker 3, run from their original files.",
            "url": "https://doskit.net/",
            "softwareVersion": "%VITE_APP_VERSION%",
            "author": {
              "@type": "Person",
              "@id": "https://doskit.net/#person"
            },
            "publisher": {
              "@type": "Person",
              "@id": "https://doskit.net/#person"
            },
            "featureList": [
              "Second Reality, Unreal, Panic and Crystal Dream 2 by Future Crew and Triton",
              "Impulse Tracker and Scream Tracker 3",
              "Original 1990s files, unmodified",
              "One press to play, with sound",
              "Works offline once opened",
              "Installable as a web app"
            ]
          },
          {
            "@type": "Person",
            "@id": "https://doskit.net/#person",
            "name": "Cameron Rye",
            "email": "cameron@rye.dev",
            "url": "https://rye.dev/",
            "sameAs": ["https://github.com/cameronrye"]
          },
          {
            "@type": "WebPage",
            "@id": "https://doskit.net/#webpage",
            "url": "https://doskit.net/",
            "name": "DosKit - DOS demoscene classics in your browser",
            "description": "DOS demoscene classics and the trackers behind them, playable in your browser.",
            "inLanguage": "en-US",
            "isPartOf": {
              "@id": "https://doskit.net/#website"
            },
            "about": {
              "@id": "https://doskit.net/#softwareapplication"
            },
            "primaryImageOfPage": {
              "@type": "ImageObject",
              "url": "https://doskit.net/og-image.png",
              "width": 1200,
              "height": 630
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif">
        <h1>JavaScript Required</h1>
        <p>DosKit requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
