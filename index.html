<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Resource Hints for Performance -->
    <link rel="dns-prefetch" href="https://api.github.com" />
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />

    <!-- Preload Critical WASM Modules (200-500ms faster startup) -->
    <link rel="preload" href="/emulators/dosbox.wasm" as="fetch" crossorigin />
    <link rel="preload" href="/emulators/dosbox-x.wasm" as="fetch" crossorigin />
    <link rel="modulepreload" href="/js-dos.js" />

    <!-- Primary Meta Tags -->
    <title>DosKit - Cross-Platform DOS Emulator</title>
    <meta name="title" content="DosKit - Cross-Platform DOS Emulator" />
    <meta name="description" content="A robust, cross-platform DOS emulator powered by js-dos WebAssembly technology. Run classic DOS applications and games directly in your browser." />
    <meta name="keywords" content="DOS, emulator, DOSBox, WebAssembly, WASM, js-dos, retro gaming, cross-platform" />
    <meta name="author" content="Cameron Rye" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DosKit" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Humans.txt -->
    <link rel="author" type="text/plain" href="/humans.txt" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-128x128.png" />

    <!-- Open Graph / Facebook -->

    <meta property="og:site_name" content="DosKit" />
    <meta property="og:title" content="DosKit - Cross-Platform DOS Emulator" />
    <meta property="og:description" content="Run classic DOS applications and games directly in your browser with WebAssembly technology. Cross-platform, offline-capable, and installable as a PWA." />
    <meta property="og:image" content="https://doskit.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DosKit - Cross-Platform DOS Emulator with terminal interface" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://doskit.net/" />
    <meta name="twitter:title" content="DosKit - Cross-Platform DOS Emulator" />
    <meta name="twitter:description" content="Run classic DOS applications and games directly in your browser with WebAssembly technology. Cross-platform, offline-capable, and installable as a PWA." />
    <meta name="twitter:image" content="https://doskit.net/og-image.png" />
    <meta name="twitter:image:alt" content="DosKit - Cross-Platform DOS Emulator with terminal interface" />
    <meta name="twitter:creator" content="@cameronrye" />
    <meta name="twitter:site" content="@cameronrye" />

    <!-- js-dos CSS (local copy) -->
    <link rel="stylesheet" href="/js-dos.css">

    <!-- js-dos JavaScript (local copy, loaded before React app) -->
    <script src="/js-dos.js"></script>
