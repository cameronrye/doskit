[sdl]
fullscreen=false
output=surface

[dosbox]
machine=svga_s3
memsize=64

[render]
frameskip=0
aspect=false
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=max

[autoexec]
# Mount the downloads directory as C:
mount C .
C:
# Run the extraction batch file
extract.bat
# Exit DOSBox after extraction
exit

