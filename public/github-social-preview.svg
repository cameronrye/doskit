<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cursor blink animation -->
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.2s infinite;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  
  <!-- Terminal window -->
  <rect x="100" y="100" width="1080" height="440" rx="24" fill="#1a1a1a" opacity="0.95"/>
  
  <!-- Window controls -->
  <circle cx="140" cy="140" r="12" fill="#ff5f56"/>
  <circle cx="180" cy="140" r="12" fill="#ffbd2e"/>
  <circle cx="220" cy="140" r="12" fill="#27c93f"/>
  
  <!-- Title bar text -->
  <text x="260" y="150" font-family="'Courier New', monospace" font-size="20" fill="rgba(255,255,255,0.7)">DosKit - Cross-Platform DOS Emulator</text>
  
  <!-- Main content area -->
  <!-- DOS Prompt -->
  <text x="140" y="260" font-family="'Courier New', monospace" font-size="52" font-weight="bold" fill="#00ff00">C:\&gt;</text>
  
  <!-- Blinking cursor -->
  <rect x="300" y="236" width="26" height="6" fill="#00ff00" class="cursor"/>
  
  <!-- Description text -->
  <text x="140" y="340" font-family="'Courier New', monospace" font-size="26" fill="rgba(255,255,255,0.9)">Run classic DOS applications and games</text>
  <text x="140" y="380" font-family="'Courier New', monospace" font-size="26" fill="rgba(255,255,255,0.9)">directly in your browser with WebAssembly</text>
  
  <!-- Features -->
  <text x="140" y="440" font-family="'Courier New', monospace" font-size="18" fill="rgba(255,255,255,0.7)">✓ WebAssembly powered  ✓ Cross-platform  ✓ PWA support  ✓ Offline capable</text>
  
  <!-- Footer -->
  <text x="640" y="590" font-family="'Courier New', monospace" font-size="22" fill="rgba(255,255,255,0.6)" text-anchor="middle">doskit.net • github.com/cameronrye/doskit</text>
</svg>

