<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DosKit - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
    }
    
    .offline-container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #00d4ff;
    }
    
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #b0b0b0;
    }
    
    .retry-button {
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      color: #1a1a2e;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .retry-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
    }
    
    .retry-button:active {
      transform: translateY(0);
    }
    
    .cached-info {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    
    .cached-info h3 {
      color: #00d4ff;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      DosKit needs to download some files to run DOS applications.
    </p>
    <button class="retry-button" onclick="window.location.reload()">
      Try Again
    </button>
    
    <div class="cached-info">
      <h3>💾 Good News!</h3>
      <p>
        If you've previously loaded any DOS apps, they may still be available 
        in your browser's cache. Try going back to the main page.
      </p>
      <button class="retry-button" onclick="window.location.href='/'">
        Go to Home
      </button>
    </div>
  </div>
  
  <script>
    // Check for online status and auto-reload
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
